name: Backport release to develop

# After a release/* branch merges into main, checks whether main has any
# commits develop doesn't (typically fixes/* commits merged straight into
# the release branch while it was stabilizing) and opens a PR carrying them
# into develop. Never merges anything itself — a person always reviews and
# merges the backport PR, resolving conflicts in it if there are any.

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  backport:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check whether develop is missing anything from main
        id: diff
        run: |
          git fetch origin develop main
          count=$(git rev-list origin/develop..origin/main --count)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Commits in main not yet in develop: $count"

      - name: Create backport branch
        if: steps.diff.outputs.count != '0'
        id: branch
        run: |
          release_name="${{ github.event.pull_request.head.ref }}"
          safe_name=$(echo "$release_name" | tr '/' '-')
          branch="backport/${safe_name}-to-develop-${{ github.run_number }}"

          git checkout -b "$branch" origin/develop
          if git merge origin/main --no-edit; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            git add -A
            git commit -m "Backport ${release_name} into develop (has conflicts, needs manual resolution)"
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open backport PR
        if: steps.diff.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const releaseName = context.payload.pull_request.head.ref;
            const branch = "${{ steps.branch.outputs.branch }}";
            const status = "${{ steps.branch.outputs.status }}";
            const statusNote = status === "conflict"
              ? "⚠️ **This backport has conflicts that need manual resolution** before it can be merged. Pull the branch locally, resolve the conflicts, and push the fix to this same branch."
              : "This backport merges cleanly.";

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Backport: ${releaseName} → develop`,
              head: branch,
              base: "develop",
              body: [
                `Automatic backport after **${releaseName}** merged into \`main\`.`,
                "",
                statusNote,
                "",
                "This carries over any commits that are in `main` but not yet in `develop` — typically `fixes/*` branches merged directly into the release branch while it was stabilizing.",
              ].join("\n"),
            });

      - name: No backport needed
        if: steps.diff.outputs.count == '0'
        run: echo "develop already has everything that just merged into main — nothing to backport."
