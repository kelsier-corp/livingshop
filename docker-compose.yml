services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: livingshop
      POSTGRES_PASSWORD: livingshop
      POSTGRES_DB: livingshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livingshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://livingshop:livingshop@postgres:5432/livingshop?schema=public
      PORT: 4000
      UPLOADS_DIR: /app/uploads
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/prisma:/app/prisma
      - api_uploads:/app/uploads
      - api_node_modules:/app/node_modules

  web:
    build: ./apps/web
    depends_on:
      - api
    environment:
      VITE_API_PROXY_TARGET: http://api:4000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/index.html:/app/index.html
      - ./apps/web/vite.config.ts:/app/vite.config.ts
      - web_node_modules:/app/node_modules

volumes:
  postgres_data:
  api_uploads:
  api_node_modules:
  web_node_modules:
